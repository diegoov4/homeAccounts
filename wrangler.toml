# Configuración de Cloudflare Workers + D1
name = "gastos-casa"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Dominio propio de la app. La dirección *.workers.dev redirige aquí, así solo hay
# una URI de redirección en Google y una cookie de sesión.
routes = [{ pattern = "casitafeliz.diemo.dev", custom_domain = true }]

[vars]
CANONICAL_HOST = "casitafeliz.diemo.dev"

# Los archivos de la app (public/) se incluyen dentro del Worker: ver src/static.js.
[build]
command = "node scripts/embed-static.mjs"
watch_dir = "public"

# Base de datos D1 (creada en Europa occidental).
[[d1_databases]]
binding = "DB"
database_name = "gastos-casa"
database_id = "d35912b2-a68c-44e4-ac44-02ef60e01f88"
migrations_dir = "migrations"

# Secretos necesarios (no se guardan en el repositorio):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET  → credenciales OAuth de Google
#   ALLOWED_EMAILS                          → emails autorizados, separados por comas
# Configúralos con:  npm run secrets
